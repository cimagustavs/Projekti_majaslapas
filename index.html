<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mājaslapu demo</title>
  <style>
    :root { --ink: #1f2a24; --soft: #5a665f; --paper: #f6f1e7; --line: #d6cbb5; --accent: #b5652b; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font: 1rem/1.6 system-ui, sans-serif; }
    main { max-width: 60rem; margin: 0 auto; padding: 3rem 1rem; }
    h1 { font-size: clamp(2rem, 5vw, 3rem); margin: 0 0 0.5rem; }
    p.lead { color: var(--soft); margin: 0 0 2.5rem; }
    ul { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 16rem), 1fr)); gap: 1rem; }
    a.card { display: block; height: 100%; padding: 1.5rem; border: 1px solid var(--line); border-radius: 0.5rem; background: #fffdf8; color: inherit; text-decoration: none; }
    a.card:hover { border-color: var(--accent); }
    a.card:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
    .tag { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); }
    .card h2 { margin: 0.4rem 0; font-size: 1.3rem; }
    .card p { margin: 0; color: var(--soft); font-size: 0.95rem; }
  </style>
</head>
<body>
  <main>
    <h1>Mājaslapu demo</h1>
    <p class="lead">Parauga mājaslapas dažādiem uzņēmumiem. Visi nosaukumi un kontakti ir izdomāti.</p>
    <ul>
      <li>
        <a class="card" href="demos/restorans/">
          <span class="tag">Restorāns</span>
          <h2>Kalme</h2>
          <p>Ēdienkarte, darba laiks, galdiņa rezervācija. LV / EN.</p>
        </a>
      </li>
    </ul>
  </main>
</body>
</html>
